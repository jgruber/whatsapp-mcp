name: Build and publish Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  OWNER: jgruber

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: bridge
            context: whatsapp-bridge
          - name: server
            context: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@v4

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/whatsapp-mcp-${{ matrix.name }}
          SHA: ${{ steps.sha.outputs.short }}
          REF: ${{ github.ref }}
        run: |
          TAGS="$IMAGE:$SHA"
          case "$REF" in
            refs/heads/main) TAGS="$TAGS,$IMAGE:latest" ;;
            refs/tags/v*)    TAGS="$TAGS,$IMAGE:${REF#refs/tags/}" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
